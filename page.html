<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-[#0B1633] via-[#1A2459] to-[#3C4C8A]">

  <!-- Card -->
  <div class="relative w-80 h-[650px] rounded-2xl shadow-2xl overflow-hidden bg-white/10 backdrop-blur-lg border border-[#3C4C8A]/20">
    
    <!-- Fond interne -->
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('fond.webp');"></div>
    
    <!-- Contenu -->
    <div class="relative z-10 flex flex-col items-center pt-14">
      
      <!-- Avatar -->
      <div class="w-40 h-40 rounded-full bg-cover bg-center ring-4 ring-[#F7CFCF]/30 shadow-lg"
           style="background-image: url('moi.png');"></div>

      <!-- Titre -->
      <h1 class="mt-4 text-2xl font-bold text-white drop-shadow-md" style="text-shadow: 2px 2px 4px #0B1633;">Aunélia</h1>
      <p class="text-sm text-white" style="text-shadow: 2px 2px 4px #0B1633;">Développeuse Web Créative</p>

      <!-- Liens -->
      <div class="flex flex-col gap-5 px-5 mt-8 w-full">
        <a href="#"
           class="block text-center h-12 leading-[3rem] rounded-lg border-2 border-[#ECA6A6] bg-[#3C4C8A]/80 text-white hover:bg-[#3C4C8A]/60 hover:border-[#F7CFCF] transition">
          Mon Portfolio
        </a>
        <a href="#"
           class="block text-center h-12 leading-[3rem] rounded-lg border-2 border-[#ECA6A6] bg-[#3C4C8A]/80 text-white hover:bg-[#3C4C8A]/60 hover:border-[#F7CFCF] transition">
          GitHub
        </a>
        <a href="#"
           class="block text-center h-12 leading-[3rem] rounded-lg border-2 border-[#ECA6A6] bg-[#3C4C8A]/80 text-white hover:bg-[#3C4C8A]/60 hover:border-[#F7CFCF] transition">
          Contact
        </a>
      </div>

      <!-- Réseaux sociaux -->
      <div class="flex gap-4 mt-6">
        <a href="#" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/40 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24" class="w-5 h-5">
            <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53A4.48 4.48 0 0 0 22.4.36a9.09 9.09 0 0 1-2.88 1.1A4.52 4.52 0 0 0 16.11 0c-2.5 0-4.52 2-4.52 4.52 0 .35.04.7.11 1.03A12.8 12.8 0 0 1 3.16.67a4.52 4.52 0 0 0-.61 2.27c0 1.56.79 2.93 1.99 3.73a4.49 4.49 0 0 1-2.05-.57v.06c0 2.18 1.55 4 3.6 4.42a4.52 4.52 0 0 1-2.04.08c.57 1.78 2.23 3.08 4.2 3.12A9.06 9.06 0 0 1 0 19.54 12.77 12.77 0 0 0 6.92 21c8.3 0 12.84-6.88 12.84-12.84 0-.2 0-.41-.01-.61A9.18 9.18 0 0 0 23 3z"/>
          </svg>
        </a>
        <a href="#" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/40 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24" class="w-5 h-5">
            <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.65 0 3 1.35 3 3v10c0 1.65-1.35 3-3 3H7c-1.65 0-3-1.35-3-3V7c0-1.65 1.35-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-2a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
          </svg>
        </a>
        <a href="#" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/40 transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24" class="w-5 h-5">
            <path d="M20.45 20.45h-3.55v-5.6c0-1.34-.02-3.07-1.87-3.07-1.88 0-2.17 1.46-2.17 2.97v5.7H9.31V9h3.41v1.56h.05c.48-.9 1.65-1.85 3.4-1.85 3.64 0 4.31 2.39 4.31 5.5v6.24zM5.34 7.43a2.07 2.07 0 110-4.14 2.07 2.07 0 010 4.14zM7.12 20.45H3.56V9h3.56v11.45z"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- Footer -->
    <footer class="absolute bottom-2 w-full text-center text-xs text-[#F7CFCF] z-10 drop-shadow-md">
      © 2025 - Tous droits réservés 
    </footer>
  </div>
</body>
</html>
